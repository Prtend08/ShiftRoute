[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shiftroute"
version = "0.1.0"
description = "Diagnosis-driven routing to reduce negative transfer in continual test-time adaptation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<2",
  "torch>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
experiment = [
  "pandas>=2.0,<2.1",
  "pyyaml>=6.0",
  "scikit-learn>=1.3,<1.4",
  "tqdm>=4.66",
  "matplotlib>=3.7,<3.8",
  "seaborn>=0.13,<0.14",
  "scipy>=1.10,<1.11",
  "torchvision>=0.15",
  "Pillow>=9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
